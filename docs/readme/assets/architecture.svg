<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>

    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14B8A6"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="580" rx="14" fill="url(#archBg)"/>
  <rect width="1160" height="580" rx="14" fill="url(#archGrid)"/>
  <rect x="1" y="1" width="1158" height="578" rx="13" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0EA5E9" letter-spacing="1.5">SYSTEM TOPOLOGY &amp; CONTRACT BOUNDARIES</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">ExecLink Full-Stack Architecture</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Strict separation between proposal intelligence and state-of-record actuals persistence.</text>
  </g>

  <!-- Contract Authority Bar (Top Right) -->
  <g transform="translate(720, 36)">
    <rect width="390" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="25" r="5" fill="#38BDF8"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">packages/contracts &amp; data/spec/</text>
    <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">Canonical JSON Specification • 29 Spec Vectors • 13 Schemas</text>
  </g>

  <!-- LEFT COLUMN: FIELD CLIENT & CAPTURE -->
  <g transform="translate(50, 110)">
    <rect width="280" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.2"/>
    <rect width="280" height="4" rx="2" fill="#0EA5E9"/>
    
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">apps/field (Flutter 3 / Dart)</text>
    <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#0EA5E9">Field Supervisor Client</text>

    <!-- Sub-boxes -->
    <g transform="translate(16, 64)">
      <rect width="248" height="60" rx="6" fill="#060A13" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Today's Work &amp; Quick Update</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">• L5/L6 Activity Workfronts</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">• Shift status: In-Progress / Blocked</text>
    </g>

    <g transform="translate(16, 134)">
      <rect width="248" height="60" rx="6" fill="#060A13" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Time Agent (Voice / Text)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">• Conversational DPR capture</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">• Client-side entity preview &amp; edit</text>
    </g>

    <g transform="translate(16, 204)">
      <rect width="248" height="60" rx="6" fill="#060A13" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Offline Sync &amp; Storage</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">• Local SQLite submission queue</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">• Idempotency fingerprint generation</text>
    </g>

    <g transform="translate(16, 276)">
      <rect width="248" height="48" rx="6" fill="#0C1B2E" stroke="#0284C7" stroke-width="0.8"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Role Authority: Supervisor</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8">Submits proposals &amp; evidence. Zero write authority.</text>
    </g>
  </g>

  <!-- CENTER COLUMN: FASTAPI SYSTEM OF RECORD -->
  <g transform="translate(380, 110)">
    <rect width="400" height="420" rx="10" fill="#0B1327" stroke="#10B981" stroke-width="1.5"/>
    <rect width="400" height="4" rx="2" fill="#10B981"/>

    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">services/api (FastAPI / Python 3)</text>
    <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#10B981">Sole System-of-Record Writer &amp; State Machine</text>

    <!-- Boundary Components inside API -->
    <g transform="translate(20, 64)">
      <rect width="360" height="52" rx="6" fill="#090E1A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Identity &amp; Role-Based Access Control</text>
      <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">JWT validation · Project scope check · Planner-only mutation gate</text>
    </g>

    <g transform="translate(20, 126)">
      <rect width="360" height="52" rx="6" fill="#090E1A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Idempotency &amp; Replay Engine</text>
      <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Idempotency-Key header · Canonical request hash · 409 conflict safety</text>
    </g>

    <g transform="translate(20, 188)">
      <rect width="360" height="66" rx="6" fill="#090E1A" stroke="#F59E0B" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">Planner Verification Transaction</text>
      <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#E2E8F0">• Locks proposal &amp; target activity</text>
      <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#E2E8F0">• Commits verified actual progress (0–100%) &amp; updates DPR</text>
    </g>

    <g transform="translate(20, 264)">
      <rect width="360" height="52" rx="6" fill="#090E1A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#10B981">SHA-256 Tamper-Evident Audit Chain</text>
      <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">entryHash = SHA-256(canonical_json(entry_body)) with linked prevHash</text>
    </g>

    <!-- Storage Row -->
    <g transform="translate(20, 328)">
      <rect width="174" height="64" rx="6" fill="#060A13" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">SQLite (Local/Dev)</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">services/api/execlink.db</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748B">Deterministic seed demo-v1</text>

      <g transform="translate(186, 0)">
        <rect width="174" height="64" rx="6" fill="#060A13" stroke="#334155" stroke-width="0.8"/>
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">PostgreSQL / Neon</text>
        <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">Cloud System of Record</text>
        <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748B">Render deployment target</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: WEB PLANNER CENTER -->
  <g transform="translate(830, 110)">
    <rect width="280" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.2"/>
    <rect width="280" height="4" rx="2" fill="#38BDF8"/>

    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">apps/web (Next.js 16 / React 19)</text>
    <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Planner Command Center</text>

    <g transform="translate(16, 64)">
      <rect width="248" height="52" rx="6" fill="#060A13" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Execution Command Center</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">S-Curve variance · Critical workfronts</text>
    </g>

    <g transform="translate(16, 126)">
      <rect width="248" height="52" rx="6" fill="#060A13" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Match Review Decision Desk</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Signal inspect · Accept/Reject · Alternatives</text>
    </g>

    <g transform="translate(16, 188)">
      <rect width="248" height="52" rx="6" fill="#060A13" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Schedule Explorer &amp; Gantt</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">L1–L6 WBS hierarchy · Float &amp; blocks</text>
    </g>

    <g transform="translate(16, 250)">
      <rect width="248" height="52" rx="6" fill="#060A13" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Project Memory &amp; Analytics</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Verified historical patterns &amp; 5 reports</text>
    </g>

    <g transform="translate(16, 312)">
      <rect width="248" height="20" rx="4" fill="#0C1B2E"/>
      <text x="124" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle">ROLE: AUTHORIZED PLANNER</text>
    </g>
  </g>

  <!-- BOTTOM SATELLITE: INTELLIGENCE ENGINE -->
  <g transform="translate(50, 465)">
    <rect width="280" height="75" rx="8" fill="#042F2E" stroke="#14B8A6" stroke-width="1.2"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF">services/intelligence</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Stateless Multi-Signal Matching Engine</text>
    <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8">Asset 40% · Disc 20% · Loc 15% · Text 10% · Syn 10% · Temp 5%</text>
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#F59E0B">PURE PROPOSAL OUTPUT • NO DIRECT WRITE ACCESS</text>
  </g>

  <!-- CONNECTIVE BUS ARROWS -->
  <!-- Field -> API -->
  <path d="M 330 250 L 380 250" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="355" y="240" font-family="-apple-system, sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">POST Event</text>

  <!-- API <-> Intelligence -->
  <path d="M 380 495 L 330 495" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="355" y="488" font-family="-apple-system, sans-serif" font-size="8" fill="#2DD4BF" text-anchor="middle">Event + Snapshot</text>

  <path d="M 330 515 L 380 515" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="355" y="530" font-family="-apple-system, sans-serif" font-size="8" fill="#2DD4BF" text-anchor="middle">MatchProposal</text>

  <!-- Web <-> API -->
  <path d="M 830 250 L 780 250" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="805" y="240" font-family="-apple-system, sans-serif" font-size="8" fill="#FBBF24" text-anchor="middle">Verify Command</text>

  <path d="M 780 290 L 830 290" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="805" y="282" font-family="-apple-system, sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">Queries / SSE Refresh</text>

  <!-- Bottom invariant text -->
  <g transform="translate(380, 550)">
    <circle cx="10" cy="10" r="3" fill="#10B981"/>
    <text x="20" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      Invariant: Intelligence is side-effect-free. Every actual progress update requires an authenticated planner command.
    </text>
  </g>
</svg>
